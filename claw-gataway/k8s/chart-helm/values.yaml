# -- Default values for chart vllm
# -- Declare variables to be passed into your templates.

# -- Model name exposed by vLLM (--served-model-name)
servedModelName: "Qwen3.5-35B-A3B"

# -- Image configuration
image:
  # -- Image repository
  repository: "swr.cn-east-3.myhuaweicloud.com/kubesre/docker.io/vllm/vllm-openai"
  # -- Image tag (Qwen3.5 MoE 需 >= v0.17.1，推荐 v0.19.0+)
  tag: "v0.19.0"

# -- Pass --trust-remote-code when loading models with custom architectures
trustRemoteCode: true

# -- Extra vLLM serve arguments (each item is one CLI arg)
# Qwen3.5 MoE example: ["--reasoning-parser", "qwen3", "--max-model-len", "32768"]
extraArgs: []

# -- Container port
containerPort: 8000
# -- Service name
serviceName:
# -- Service port
servicePort: 80
# -- Additional ports configuration
extraPorts: []

# -- Number of replicas
replicaCount: 1

# -- Deployment strategy configuration
deploymentStrategy: {}

# -- Resource configuration
resources:
  requests:
    cpu: 8
    memory: 32Gi
  limits:
    cpu: 16
    memory: 64Gi

# -- GPU scheduling
gpu:
  enabled: true
  count: 1
  # Leave empty unless your cluster defines a RuntimeClass (e.g. nvidia)
  runtimeClassName: ""
  # Leave empty to schedule on any GPU node
  models: []

# -- Autoscaling configuration
autoscaling:
  # -- Enable autoscaling
  enabled: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 100
  # -- Target CPU utilization for autoscaling
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Configmap
configs: {}

# -- Secrets configuration
secrets: {}

# -- External configuration
externalConfigs: []

# -- Custom Objects configuration
customObjects: []

# -- Disruption Budget Configuration
maxUnavailablePodDisruptionBudget: ""

# -- Additional configuration for the init container
extraInit:
  # -- Model storage: local (hostPath, no S3) or pvc (PersistentVolumeClaim)
  storage:
    # -- Storage type: local mounts node hostPath; pvc creates a PVC (use with S3 download)
    type: local
    # -- Node-local directory containing model weights (used when storage.type=local)
    hostPath: "/data/models/Qwen3.5-35B-A3B"

  # -- Model download from S3 (optional, disable when using local storage)
  modelDownload:
    # -- Enable model download job and wait container
    enabled: false
    # -- Image configuration for model download operations
    image:
      # -- Image repository
      repository: "amazon/aws-cli"
      # -- Image tag
      tag: "2.6.4"
      # -- Image pull policy
      pullPolicy: "IfNotPresent"
    # -- Wait container configuration (init container that waits for model to be ready)
    waitContainer:
      # -- Command to execute
      command: ["/bin/bash"]
      # -- Arguments for the wait container
      args:
        - "-eucx"
        - "while aws --endpoint-url $S3_ENDPOINT_URL s3 sync --dryrun s3://$S3_BUCKET_NAME/$S3_PATH /data | grep -q download; do sleep 10; done"
      # -- Environment variables (optional, overrides S3 defaults entirely if specified)
      # env:
      #   - name: HUGGING_FACE_HUB_TOKEN
      #     value: "your-token"
      #   - name: MODEL_ID
      #     value: "meta-llama/Llama-2-7b"
    # -- Download job configuration (job that actually downloads the model)
    downloadJob:
      # -- Command to execute
      command: ["/bin/bash"]
      # -- Arguments for the download job
      args:
        - "-eucx"
        - "aws --endpoint-url $S3_ENDPOINT_URL s3 sync s3://$S3_BUCKET_NAME/$S3_PATH /data"
      # -- Environment variables (optional, overrides S3 defaults entirely if specified)
      # env:
      #   - name: HUGGING_FACE_HUB_TOKEN
      #     value: "your-token"
      #   - name: MODEL_ID
      #     value: "meta-llama/Llama-2-7b"

  # -- Custom init containers (appended after wait-download-model if modelDownload is enabled)
  initContainers: []
  # Example for llm-d sidecar:
  # initContainers:
  #   - name: llm-d-routing-proxy
  #     image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.2.0
  #     imagePullPolicy: IfNotPresent
  #     ports:
  #       - containerPort: 8080
  #         name: proxy
  #     securityContext:
  #       runAsUser: 1000

  # -- Path of the model on S3 (only used when modelDownload.enabled=true)
  s3modelpath: "relative_s3_model_path/Qwen3.5-35B-A3B"
  # -- Storage size for the PVC (only used when storage.type=pvc)
  pvcStorage: "1Gi"
  # -- Disable AWS EC2 metadata service
  awsEc2MetadataDisabled: true

# -- Additional containers configuration
extraContainers: []

# -- Readiness probe configuration
readinessProbe:
  initialDelaySeconds: 120
  # -- How often (in seconds) to perform the readiness probe
  periodSeconds: 5
  # -- Number of times after which if a probe fails in a row, Kubernetes considers that the overall check has failed: the container is not ready
  failureThreshold: 3
   # -- Configuration of the Kubelet http request on the server
  httpGet:
    # -- Path to access on the HTTP server
    path: /health
    # -- Name or number of the port to access on the container, on which the server is listening
    port: 8000

# -- Liveness probe configuration
livenessProbe:
  initialDelaySeconds: 300
  # -- Number of times after which if a probe fails in a row, Kubernetes considers that the overall check has failed: the container is not alive
  failureThreshold: 3
  # -- How often (in seconds) to perform the liveness probe
  periodSeconds: 10
  # -- Configuration of the Kubelet http request on the server
  httpGet:
    # -- Path to access on the HTTP server
    path: /health
    # -- Name or number of the port to access on the container, on which the server is listening
    port: 8000

labels:
  environment: "test"
  release: "test"
